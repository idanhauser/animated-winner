version: 2.1

orbs:
  build-2secure: appdome/build-2secure@1.1.8  # Ensure this is the correct version

workflows:
  version: 2
  deploy:
    jobs:
      - build-2secure/appdome_runner:
          appFile: "https://github.com/idanhauser/TestAppdome_orb_private/raw/refs/heads/main/files/TimeCard1.apk"  # Ensure this points to the actual file
          build-with-logs: true
          google-play-signing: true  # Ensure this is either true or false
          runner: "ANDROID_AUTO_SIGNING"
          team-id: "dsfsdfsdf"  # Replace with your actual Appdome team ID
